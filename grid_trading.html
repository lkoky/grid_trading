<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票网格交易计算</title>
    <!-- 引入Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- 引入jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- 引入Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root {
            --bg0: #070b14;
            --bg1: #0b1222;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-2: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
            --border-2: rgba(255, 255, 255, 0.18);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.65);
            --muted-2: rgba(255, 255, 255, 0.45);
            --accent: #59d8ff;
            --accent-2: #9c7bff;
            --good: #2de38f;
            --warn: #ffb347;
            --bad: #ff5c86;
            --shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.45);
            --radius: 16px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 0;
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(89, 216, 255, 0.24), transparent 60%),
                radial-gradient(900px 520px at 85% 10%, rgba(156, 123, 255, 0.20), transparent 55%),
                radial-gradient(1000px 700px at 55% 110%, rgba(45, 227, 143, 0.10), transparent 60%),
                linear-gradient(180deg, var(--bg0), var(--bg1));
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.12;
            mask-image: radial-gradient(closest-side at 50% 20%, rgba(0,0,0,1), rgba(0,0,0,0));
        }

        .app-container {
            display: flex;
            gap: 18px;
            height: 100vh;
            padding: 18px;
        }

        .left-nav,
        .right-content {
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--panel);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
        }

        .left-nav {
            width: 32%;
            min-width: 280px;
            display: flex;
            flex-direction: column;
        }
        .right-content {
            width: 68%;
            padding: 26px 26px 32px;
            overflow-y: auto;
        }
        .left-nav .left-scroll {
            padding: 18px;
            overflow-y: auto;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
            padding: 18px 18px 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        }
        .header-title { min-width: 0; }
        .left-nav h2 {
            font-size: 1.05rem;
            margin: 0;
            letter-spacing: 0.02em;
            color: var(--text);
            line-height: 1.2;
        }
        .status-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            min-height: 20px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            white-space: nowrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.35);
        }
        .status-online .status-dot { background: var(--good); box-shadow: 0 0 0 6px rgba(45, 227, 143, 0.15); }
        .status-offline .status-dot { background: var(--bad); box-shadow: 0 0 0 6px rgba(255, 92, 134, 0.14); }
        .status-meta { font-size: 12px; color: var(--muted-2); white-space: nowrap; }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-header,
        .btn-primary,
        .btn-success,
        .btn-danger,
        .btn-secondary {
            border-radius: 12px;
            border-color: transparent;
            box-shadow: 0 10px 22px rgba(0,0,0,0.28);
        }
        .btn-header {
            height: 40px;
            padding: 0 14px;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, rgba(89,216,255,0.95), rgba(156,123,255,0.92));
        }
        .btn-success {
            background: linear-gradient(135deg, rgba(45,227,143,0.95), rgba(89,216,255,0.80));
        }
        .btn-danger {
            background: linear-gradient(135deg, rgba(255,92,134,0.96), rgba(255,179,71,0.70));
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0px); }

        .stock-item {
            padding: 12px 14px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            text-align: left;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stock-item:hover {
            border-color: rgba(89,216,255,0.55);
            box-shadow: 0 0 0 4px rgba(89, 216, 255, 0.12);
            transform: translateY(-1px);
        }
        .stock-item.active {
            background: linear-gradient(135deg, rgba(89,216,255,0.22), rgba(156,123,255,0.18));
            border-color: rgba(89,216,255,0.60);
            box-shadow: 0 0 0 4px rgba(156, 123, 255, 0.12);
        }
        .no-stocks {
            padding: 14px;
            border-radius: 14px;
            border: 1px dashed rgba(255,255,255,0.16);
            color: var(--muted);
            background: rgba(255,255,255,0.04);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .page-title { min-width: 0; }
        .right-content h1 {
            font-size: 1.55rem;
            margin: 0;
            letter-spacing: 0.01em;
            color: var(--text);
        }
        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        .form-group { margin-bottom: 18px; }
        .form-control, .form-select {
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            box-shadow: none;
        }
        .form-control:focus {
            border-color: rgba(89,216,255,0.65);
            box-shadow: 0 0 0 4px rgba(89,216,255,0.14);
            background: rgba(255,255,255,0.07);
            color: var(--text);
        }
        label { color: var(--muted); }
        .form-text { color: var(--muted-2); }

        .result-section {
            margin-top: 22px;
            padding: 18px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            box-shadow: var(--shadow-soft);
        }
        .animate-in {
            animation: rise 240ms ease-out;
        }
        @keyframes rise {
            from { transform: translateY(8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .result-section h3, .result-section h4 { color: var(--text); }

        .smart-tip {
            margin: 12px 0 6px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(89,216,255,0.35);
            background: linear-gradient(135deg, rgba(89,216,255,0.12), rgba(156,123,255,0.10));
            color: var(--text);
        }
        .smart-tip .tip-title { font-weight: 600; letter-spacing: 0.01em; }
        .smart-tip .tip-body { margin-top: 6px; color: var(--muted); font-size: 13px; }

        .profit-verification {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,179,71,0.28);
            background: rgba(255,179,71,0.10);
        }
        .no-stock-selected {
            text-align: center;
            color: var(--muted);
            padding: 40px 18px 28px;
            border: 1px dashed rgba(255,255,255,0.16);
            border-radius: var(--radius);
            background: rgba(255,255,255,0.03);
        }

        .table-style {
            width: 100%;
            border: 1px solid var(--border);
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 14px;
        }
        .table-style td {
            border-bottom: 1px solid rgba(255,255,255,0.10);
            padding: 10px 12px;
        }
        .table-style tr:last-child td { border-bottom: none; }
        .table-style tr:hover td { background: rgba(89,216,255,0.06); }
        .table-style .title {
            text-align: center;
            color: var(--text);
            background: rgba(255,255,255,0.08);
            font-weight: 600;
            position: sticky;
            top: 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .table-style .value {
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .table-style .center { text-align: center; }

        .modal-content {
            border-radius: 18px;
            border: 1px solid var(--border);
            background: rgba(10, 16, 30, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }
        .modal-header, .modal-footer {
            border-color: rgba(255,255,255,0.10);
        }
        .table { color: var(--text); }
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            color: var(--text);
            background-color: rgba(255,255,255,0.04);
        }
        .btn-close { filter: invert(1) grayscale(1); opacity: 0.7; }

        .busy-overlay {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(0,0,0,0.38);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
        }
        .busy-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(12, 18, 34, 0.86);
            box-shadow: var(--shadow);
            min-width: 260px;
        }
        .busy-text { color: var(--text); font-size: 14px; }

        @media (max-width: 991.98px) {
            body { overflow: auto; }
            .app-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .left-nav, .right-content { width: 100%; }
            .left-nav { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧导航栏 -->
        <div class="left-nav">
            <div class="header-container">
                <div class="header-title">
                    <h2>计算记录</h2>
                    <div class="status-line">
                        <span id="service-status" class="status-pill status-unknown"><span class="status-dot"></span><span class="status-text">服务检测中</span></span>
                        <span id="last-sync" class="status-meta"></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button type="button" id="new-calculation-btn" class="btn btn-primary btn-header">新增</button>
                    <button type="button" id="view-history-btn" class="btn btn-secondary btn-header">历史记录</button>
                </div>
            </div>
            <div class="left-scroll">
                <div id="stock-list"></div>
            </div>
        </div>
        
        <!-- 右侧内容区域 -->
        <div class="right-content">
            <div class="page-header">
                <div class="page-title">
                    <h1>网格交易计算</h1>
                    <div class="subtitle">实时计算 · 一键保存 · 历史可追溯</div>
                </div>
                <button type="button" id="delete-btn" class="btn btn-danger" style="display: none; height: 40px; padding: 0 14px; font-size: 14px;">删除</button>
            </div>
        
        <!-- 输入表单 -->
        <!-- 默认显示区域：未选择股票时 -->
        <div id="no-selection" class="no-stock-selected">
            <h3>请从左侧选择一个股票</h3>
            <p>或在下方表单中输入新的股票信息</p>
        </div>
        
        <!-- 输入表单 -->
        <form id="grid-form" class="mb-4" style="display: none;">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="stock_name">名称</label>
                        <input type="text" class="form-control" id="stock_name" placeholder="请输入名称" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="stock_code">编码（可选）</label>
                        <input type="text" class="form-control" id="stock_code" placeholder="请输入编码">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="cost_price">成本价 (元)</label>
                        <input type="number" class="form-control" id="cost_price" step="0.0001" placeholder="请输入成本价" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="current_shares">当前股数</label>
                        <input type="number" class="form-control" id="current_shares" step="100" placeholder="请输入当前股数" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="current_price">当前价格 (元)</label>
                        <input type="number" class="form-control" id="current_price" step="0.0001" placeholder="请输入当前价格" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="expected_profit">回本金额 (元)</label>
                        <input type="number" class="form-control" id="expected_profit" step="1" placeholder="请输入回本金额" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="grid_count">网格数量</label>
                        <input type="number" class="form-control" id="grid_count" min="1" placeholder="请输入网格数量" required>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; justify-content: flex-end; align-items: center;">
                <button type="submit" class="btn btn-primary me-3" style="height: 45px; padding: 0 20px; font-size: 16px;">计算</button>
                <button type="button" id="save-btn" class="btn btn-success" style="display: none; height: 45px; padding: 0 20px; font-size: 16px;">保存</button>
            </div>
        </form>
        
    
        
        <!-- 结果显示区域 -->
        <div id="result" class="result-section" style="display: none;">
            <h3 class="mb-3">计算结果</h3>
            <div id="smart-tip" class="smart-tip" style="display: none;">
                <div class="tip-title">智能提示</div>
                <div class="tip-body" id="smart-tip-body"></div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>股票信息：</strong><span id="result-stock-info"></span></p>
                    <p><strong>每网格股票数：</strong><span id="result-shares-per-grid"></span> 股</p>
                    <p><strong>每网格价格间距：</strong><input type="number" id="result-price-increase" class="form-control form-control-sm d-inline w-auto" step="0.0001" /> 元</p>
                    <p><strong>每网格价格占比：</strong><input type="number" id="result-price-percentage" class="form-control form-control-sm d-inline w-auto" step="0.01" /> %</p>
                    <p><strong>实际盈利：</strong><span id="result-actual-profit"></span> 元</p>
                </div>
                <div class="col-md-6">
                    <p><strong>当前总股数：</strong><span id="result-current-shares"></span> 股</p>
                    <p><strong>总成本：</strong><span id="result-total-cost"></span> 元</p>
                    <p><strong>当前市值：</strong><span id="result-current-value"></span> 元</p>
                    <p><strong>浮动盈亏：</strong><span id="result-floating-profit"></span> 元</p>
                    <p><strong>浮动盈亏比例：</strong><span id="result-floating-profit-ratio"></span> %</p>
                    <p><strong>回本金额：</strong><span id="result-expected-profit"></span> 元</p>
                    
                </div>
            </div>
            
            <h4 class="mt-4">网格价格列表</h4>
            <div id="grid-prices-list"></div>
            
            <div class="profit-verification">
                <h4>盈利验证</h4>
                <p><strong>总卖出金额：</strong><span id="result-total-sold"></span> 元</p>
                <p><strong>实际盈利与回本金额差值：</strong><span id="result-profit-diff"></span> 元</p>
            </div>
        </div>
    </div>
    
    <div id="busy-overlay" class="busy-overlay d-none">
        <div class="busy-card">
            <div class="spinner-border" style="color: var(--accent);" role="status" aria-label="loading"></div>
            <div id="busy-text" class="busy-text">处理中...</div>
        </div>
    </div>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script>
        function setBusy(busy, text) {
            const overlay = $('#busy-overlay');
            if (busy) {
                $('#busy-text').text(text || '处理中...');
                overlay.removeClass('d-none');
            } else {
                overlay.addClass('d-none');
            }
        }

        function showToast(type, message) {
            const id = 't' + Math.random().toString(16).slice(2);
            const bg = type === 'success'
                ? 'rgba(45,227,143,0.18)'
                : type === 'warning'
                    ? 'rgba(255,179,71,0.18)'
                    : 'rgba(255,92,134,0.18)';

            const border = type === 'success'
                ? 'rgba(45,227,143,0.35)'
                : type === 'warning'
                    ? 'rgba(255,179,71,0.35)'
                    : 'rgba(255,92,134,0.35)';

            const toast = $(`
                <div id="${id}" class="toast align-items-center text-white border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2400">
                    <div class="d-flex" style="border: 1px solid ${border}; border-radius: 14px; background: ${bg}; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 14px 30px rgba(0,0,0,0.35);">
                        <div class="toast-body" style="color: var(--text);">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `);
            $('#toast-container').append(toast);
            const bsToast = new bootstrap.Toast(document.getElementById(id));
            bsToast.show();
            toast.on('hidden.bs.toast', function() { toast.remove(); });
        }

        $(document).ready(function() {
            // 页面加载时加载历史股票记录
            loadStockList();
            
            // 首次进入页面时显示计算表单，支持新增计算
            $('#no-selection').hide();
            $('#grid-form').show();
            
            // 为成本价、当前股数和当前价格字段添加变化监听器
            $('#cost_price, #current_shares, #current_price').on('input', function() {
                // 获取三个字段的值
                const costPrice = parseFloat($('#cost_price').val());
                const currentShares = parseFloat($('#current_shares').val());
                const currentPrice = parseFloat($('#current_price').val());
                
                // 检查三个字段是否都有有效数值
                if (!isNaN(costPrice) && !isNaN(currentShares) && !isNaN(currentPrice) && 
                    costPrice > 0 && currentShares > 0 && currentPrice > 0) {
                    // 计算回本金额默认值 = 总成本 - 当前价值
                    const expectedProfit = (costPrice * currentShares) - (currentPrice * currentShares);
                    // 更新回本金额字段，保留整数
                    $('#expected_profit').val(Math.round(expectedProfit));
                }
            });
            
            // 新增按钮点击事件
            $('#new-calculation-btn').click(function() {
                // 移除所有股票项的active类
                $('.stock-item').removeClass('active');
                // 隐藏结果显示区域
                $('#result').hide();
                // 隐藏保存和删除按钮
                $('#save-btn').hide();
                $('#delete-btn').hide();
                // 清空表单数据
                $('#grid-form')[0].reset();
                // 显示表单（确保表单可见）
                $('#grid-form').show();
                // 重置currentResult变量
                currentResult = null;
            });
            
            // 监听表单提交事件
            $('#grid-form').submit(function(e) {
                e.preventDefault();
                
                // 收集表单数据
                const data = {
                    stock_code: $('#stock_code').val() || '',
                    stock_name: $('#stock_name').val(),
                    cost_price: parseFloat($('#cost_price').val()),
                    current_shares: parseFloat($('#current_shares').val()),
                    expected_profit: parseFloat($('#expected_profit').val()),
                    current_price: parseFloat($('#current_price').val()),
                    grid_count: parseInt($('#grid_count').val())
                };
                
                // 验证输入数据
                if (isNaN(data.cost_price) || data.cost_price <= 0) {
                    showToast('warning', '成本价必须为正数');
                    return;
                }
                if (isNaN(data.current_shares) || data.current_shares <= 0) {
                    showToast('warning', '当前股数必须为正数');
                    return;
                }
                if (isNaN(data.expected_profit) || data.expected_profit <= 0) {
                    showToast('warning', '回本金额必须为正数');
                    return;
                }
                if (isNaN(data.current_price) || data.current_price <= 0) {
                    showToast('warning', '当前价格必须为正数');
                    return;
                }
                if (isNaN(data.grid_count) || data.grid_count <= 0) {
                    showToast('warning', '网格数量必须为正整数');
                    return;
                }
                
                // 发送AJAX请求
                $.ajax({
                    url: '/grid-trading/calculate_grid',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),

        // 加载左侧股票列表
        function loadStockList() {
            $.ajax({
                url: '/grid-trading/get_history',
                type: 'GET',
                success: function(response) {
                    $('#service-status').removeClass('status-offline').addClass('status-online');
                    $('#service-status .status-text').text('服务正常');
                    $('#last-sync').text('同步：' + new Date().toLocaleTimeString());
                    const stockList = $('#stock-list');
                    stockList.empty();
                    
                    // 如果没有历史记录
                    if (response.history.length === 0) {
                        stockList.append('<div class="no-stocks">暂无计算记录</div>');
                        return;
                    }
                    
                    // 首先按updated_at排序（从最新到最旧）
                    response.history.sort(function(a, b) {
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    });
                    
                    // 去重：每个股票只显示一次，保留最新的记录
                    const uniqueStocks = {};
                    response.history.forEach(function(record) {
                        // 使用股票名称作为唯一标识（如果有代码则使用代码）
                        const key = record.stock_code || record.stock_name;
                        if (!uniqueStocks[key]) {
                            uniqueStocks[key] = record;
                        }
                    });
                    
                    // 将唯一股票转换为数组并再次按updated_at排序（从最新到最旧）
                    const sortedStocks = Object.values(uniqueStocks).sort(function(a, b) {
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    });
                    
                    // 遍历排序后的股票列表并添加到左侧导航
                    sortedStocks.forEach(function(stock) {
                        const stockItem = $('<div class="stock-item"></div>');
                        stockItem.attr('data-id', stock.id);
                        
                        let stockHtml = `${stock.stock_name}`;
                        if (stock.stock_code) {
                            stockHtml += ` (${stock.stock_code})`;
                        }
                        
                        stockItem.html(stockHtml);
                        
                        // 绑定点击事件
                        stockItem.click(function() {
                            // 移除其他项的active类
                            $('.stock-item').removeClass('active');
                            // 添加当前项的active类
                            $(this).addClass('active');
                            // 加载选中的股票
                            loadSelectedStock(stock.id);
                        });
                        
                        stockList.append(stockItem);
                    });
                },
                error: function(xhr, status, error) {
                    $('#service-status').removeClass('status-online').addClass('status-offline');
                    $('#service-status .status-text').text('服务不可用');
                    const errorMsg = xhr.responseJSON ? xhr.responseJSON.error : '获取历史记录出错';
                    showToast('danger', '错误：' + errorMsg);
                }
            });
        }

        // 刷新历史记录函数
        function refreshHistory() {
            $.ajax({
                url: '/grid-trading/get_history',
                type: 'GET',
                success: function(response) {
                    const historyTable = $('#history-table tbody');
                    historyTable.empty();
                    
                    response.history.forEach(function(record) {

                            row.append(`<td>${record.id}</td>`);
                            row.append(`<td>${record.stock_name}</td>`);
                            row.append(`<td>${record.stock_code || '-'}</td>`);
                            row.append(`<td>${record.cost_price ? record.cost_price.toFixed(2) : '-'}</td>`);
                            row.append(`<td>${record.current_shares}</td>`);
                            row.append(`<td>${record.expected_profit}</td>`);
                            row.append(`<td>${record.current_price}</td>`);
                            row.append(`<td>${record.grid_count}</td>`);

                    $('#history-table').off('click', '.delete-btn').on('click', '.delete-btn', function() {

                            deleteCalculation(id);
                        }
                    });

                error: function(xhr, status, error) {
                    const errorMsg = xhr.responseJSON ? xhr.responseJSON.error : '获取历史记录出错';
                    showToast('danger', '错误：' + errorMsg);
                }
            });

        // 保存当前结果的变量
        let currentResult = null;
        
        // 修改showResult函数，保存当前结果
        function showResult(result) {
            // 保存当前结果
            currentResult = result;
            
            // 显示结果区域
            $('#result').show();
            $('#result').removeClass('animate-in');
            requestAnimationFrame(function() { $('#result').addClass('animate-in'); });
            
            // 只有当没有id字段时才显示保存按钮（表示这是新计算的结果）
            if (!result.id) {
                $('#save-btn').show();
            } else {
                $('#save-btn').hide();
            }
            
            // 根据是否有id字段判断是否显示删除按钮
            if (result.id) {
                $('#delete-btn').show();
            } else {
                $('#delete-btn').hide();
            }
            
            // 填充基本信息
            let stockInfo = result.stock_name;
            if (result.stock_code) {
                stockInfo += ' ' + result.stock_code;
            }
            $('#result-stock-info').text(stockInfo);
            $('#result-shares-per-grid').text(result.shares_per_grid);
            $('#result-price-increase').val(result.price_increase_per_grid);
            $('#result-price-percentage').val(result.price_percentage_per_grid);
            $('#result-current-shares').text(result.current_shares);
            $('#result-total-cost').text(result.total_cost);
            $('#result-current-value').text(result.current_value.toFixed(2));
            $('#result-floating-profit').text(result.floating_profit.toFixed(2));
            $('#result-floating-profit-ratio').text(result.floating_profit_ratio.toFixed(2));
            $('#result-expected-profit').text(result.expected_profit);
            $('#result-actual-profit').text(result.actual_profit);
            $('#result-total-sold').text(result.total_sold);
            
            // 计算盈利差值
            const profitDiff = result.actual_profit - result.expected_profit;
            $('#result-profit-diff').text(profitDiff.toFixed(2));
            
            // 填充网格价格列表
            const gridPricesList = $('#grid-prices-list');
            gridPricesList.empty();

            const tips = [];
            if (result.price_percentage_per_grid != null) {
                const p = Number(result.price_percentage_per_grid);
                if (!isNaN(p)) {
                    if (p < 0.5) tips.push('网格过密：单格占比偏小，可能导致交易频繁与手续费影响更明显。');
                    if (p >= 0.5 && p <= 2.5) tips.push('网格密度适中：更利于平衡成交概率与收益目标。');
                    if (p > 2.5 && p <= 5) tips.push('网格偏疏：更依赖较大波动触发成交，可关注回撤承受能力。');
                    if (p > 5) tips.push('网格过疏：触发难度较高，建议确认目标回本金额与网格数量是否匹配。');
                }
            }
            if (result.current_price != null && result.cost_price != null) {
                const cp = Number(result.current_price);
                const cost = Number(result.cost_price);
                if (!isNaN(cp) && !isNaN(cost) && cost > 0) {
                    const ratio = (cp - cost) / cost * 100;
                    if (ratio < -10) tips.push('当前价格低于成本较多：可优先关注下跌买入网格的资金与仓位规划。');
                    if (ratio > 10) tips.push('当前价格高于成本较多：可重点关注上涨卖出网格的逐步减仓节奏。');
                }
            }
            if (tips.length > 0) {
                $('#smart-tip-body').text(tips.slice(0, 2).join(' '));
                $('#smart-tip').show();
            } else {
                $('#smart-tip').hide();
            }
            
            // 检查是否有grid_details字段（新格式）
            if (result.grid_details && result.grid_details.length > 0) {
                // 创建表格
                const table = $('<table class="table-style"></table>');
                
                // 添加表头
                const thead = $('<tr></tr>');
                thead.append('<td class="title center">网格序号</td>');
                thead.append('<td class="title center">价格 (元)</td>');
                thead.append('<td class="title center">买/卖出股数 (股)</td>');
                thead.append('<td class="title center">剩余股数 (股)</td>');
                thead.append('<td class="title center">当前网格买/卖出盈利 (元)</td>');
                thead.append('<td class="title center">单网格盈利 (元)</td>');
                table.append(thead);
                
                // 添加表内容
                let rowIndex = 1;
                
                // 1. 先添加下跌网格（买入）
                const buyGrids = result.grid_details.filter(detail => detail.type === 'buy').sort((a, b) => a.price - b.price);
                const sellGrids = result.grid_details.filter(detail => detail.type === 'sell').sort((a, b) => a.price - b.price);
                
                // 添加下跌网格行
                buyGrids.forEach((gridDetail, index) => {
                    const row = $('<tr></tr>');
                    row.append(`<td class="value center">${rowIndex++}</td>`);
                    row.append(`<td class="value center">${gridDetail.price}</td>`);
                    
                    // 买/卖出股数：买入为负数
                    const shares = -gridDetail.shares;
                    row.append(`<td class="value center">${shares}</td>`);
                    
                    // 剩余股数
                    row.append(`<td class="value center">${gridDetail.remaining_shares}</td>`);
                    
                    // 当前网格买/卖出盈利：买入为负数，计算方式为买/卖出股数×每网格价格间距
                    const operationProfit = shares * result.price_increase_per_grid;
                    row.append(`<td class="value center">${operationProfit.toFixed(2)}</td>`);
                    
                    // 单网格盈利：计算方式为（剩余股数+买/卖出股数）×网格间距价格，买入为亏损，故为负数
                    const singleGridProfit = (gridDetail.remaining_shares + shares) * result.price_increase_per_grid;
                    const lossProfit = -singleGridProfit;
                    row.append(`<td class="value center">${lossProfit.toFixed(2)}</td>`);
                    
                    table.append(row);
                });
                
                // 2. 添加当前价格基准行
                const currentPriceRow = $('<tr></tr>');
                currentPriceRow.append(`<td class="value center">${rowIndex++}</td>`);
                currentPriceRow.append(`<td class="value center">${result.current_price}</td>`);
                currentPriceRow.append(`<td class="value center">0</td>`); // 买/卖出股数为0
                
                // 剩余股数：使用当前股数（固定值）
                currentPriceRow.append(`<td class="value center">${result.current_shares}</td>`);
                
                currentPriceRow.append(`<td class="value center">0</td>`); // 当前网格买/卖出盈利为0
                currentPriceRow.append(`<td class="value center">0</td>`); // 单网格盈利为0
                table.append(currentPriceRow);
                
                // 3. 添加上涨网格（卖出）
                sellGrids.forEach(gridDetail => {
                    const row = $('<tr></tr>');
                    row.append(`<td class="value center">${rowIndex++}</td>`);
                    row.append(`<td class="value center">${gridDetail.price}</td>`);
                    
                    // 买/卖出股数：卖出为正数
                    const shares = gridDetail.shares;
                    row.append(`<td class="value center">${shares}</td>`);
                    
                    // 剩余股数
                    row.append(`<td class="value center">${gridDetail.remaining_shares}</td>`);
                    
                    // 当前网格买/卖出盈利：卖出为正数
                    const operationProfit = gridDetail.shares * result.price_increase_per_grid;
                    row.append(`<td class="value center">${operationProfit.toFixed(2)}</td>`);
                    
                    // 单网格盈利：计算方式为（买/卖出股数 + 剩余股数）× 每网格价格间距
                    const singleGridProfit = (gridDetail.shares + gridDetail.remaining_shares) * result.price_increase_per_grid;
                    row.append(`<td class="value center">${singleGridProfit.toFixed(2)}</td>`);
                    
                    table.append(row);
                });
                
                gridPricesList.append(table);
            } else {
                // 兼容旧格式
                const table = $('<table class="table-style"></table>');
                
                // 添加表头
                const thead = $('<tr></tr>');
                thead.append('<td class="title center">网格序号</td>');
                thead.append('<td class="title center">价格 (元)</td>');
                table.append(thead);
                
                // 添加表内容
                result.grid_prices.forEach((price, index) => {
                    const row = $('<tr></tr>');
                    row.append(`<td class="value center">${index + 1}</td>`);
                    row.append(`<td class="value center">${price}</td>`);
                    table.append(row);
                });
                
                gridPricesList.append(table);
            }
            
            // 添加价格间距和价格占比修改事件监听器
            // 先移除旧的监听器，避免重复绑定
            $('#result-price-increase, #result-price-percentage').off('input change blur');
            
            // 添加输入事件监听器，实时更新另一个参数
            $('#result-price-increase').on('input', function() {
                const priceIncrease = parseFloat($(this).val());
                if (!isNaN(priceIncrease) && priceIncrease > 0) {
                    const pricePercentage = (priceIncrease / result.current_price) * 100;
                    $('#result-price-percentage').val(pricePercentage.toFixed(2));
                }
            });
            
            $('#result-price-percentage').on('input', function() {
                const pricePercentage = parseFloat($(this).val());
                if (!isNaN(pricePercentage) && pricePercentage > 0) {
                    const priceIncrease = (pricePercentage / 100) * result.current_price;
                    $('#result-price-increase').val(priceIncrease.toFixed(4));
                }
            });
            
            // 添加失去焦点或回车事件监听器，触发重新计算
            $('#result-price-increase, #result-price-percentage').on('change blur', function() {
                // 获取修改后的值
                const priceIncrease = parseFloat($('#result-price-increase').val());
                const pricePercentage = parseFloat($('#result-price-percentage').val());
                
                // 验证输入值
                if (isNaN(priceIncrease) || priceIncrease <= 0 || isNaN(pricePercentage) || pricePercentage <= 0) {
                    showToast('warning', '价格间距和价格占比必须为正数');
                    // 恢复原始值
                    $('#result-price-increase').val(result.price_increase_per_grid);
                    $('#result-price-percentage').val(result.price_percentage_per_grid);
                    return;
                }
                
                // 构建新的计算参数
                const newParams = {
                    stock_code: result.stock_code || '',
                    stock_name: result.stock_name,
                    cost_price: result.cost_price,
                    current_shares: result.current_shares,
                    expected_profit: result.expected_profit,
                    current_price: result.current_price,
                    grid_count: result.grid_count,
                    // 添加修改后的参数
                    price_increase_per_grid: priceIncrease
                };
                
                // 发送AJAX请求重新计算
                $.ajax({
                    url: '/grid-trading/calculate_grid',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(newParams),
                    beforeSend: function() { setBusy(true, '正在重新计算...'); },
                    complete: function() { setBusy(false); },
                    success: function(newResult) {
                        // 更新结果显示
                        showResult(newResult);
                    },
                    error: function(xhr, status, error) {
                        const errorMsg = xhr.responseJSON ? xhr.responseJSON.error : '重新计算出错';
                        showToast('danger', '错误：' + errorMsg);
                        // 恢复原始值
                        $('#result-price-increase').val(result.price_increase_per_grid);
                        $('#result-price-percentage').val(result.price_percentage_per_grid);
                    }
                });
            });
        }
        
        // 查看历史记录按钮点击事件
        $('#view-history-btn').click(function() {
            const historyModal = new bootstrap.Modal(document.getElementById('historyModal'));
            refreshHistory();
            historyModal.show();
        });
    </script>
    
    <!-- 历史记录模态框 -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="historyModalLabel">历史记录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table id="history-table" class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>编码</th>
                                <th>成本价</th>
                                <th>当前股数</th>
                                <th>回本金额</th>
                                <th>当前价格</th>
                                <th>网格数量</th>
                                <th>实际盈利</th>
                                <th>更新时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody><!-- 历史记录通过JavaScript加载 --></tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
